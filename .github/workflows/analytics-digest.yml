name: Nonna Angela Analytics digest (opt-in)
on:
  schedule:
    # 09:15 UTC: 09:15 winter / 10:15 summer in the Canary Islands.
    # Worker determines Canary-local date and adds weekly digest on Monday.
    - cron: '15 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke server-only digest worker
        env:
          ANALYTICS_DIGEST_URL: ${{ secrets.ANALYTICS_DIGEST_URL }}
          ANALYTICS_CRON_SECRET: ${{ secrets.ANALYTICS_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$ANALYTICS_DIGEST_URL" || -z "$ANALYTICS_CRON_SECRET" ]]; then
            echo "Digest inactive: required secrets not configured."
            exit 0
          fi
          if [[ ! "$ANALYTICS_DIGEST_URL" =~ ^https://[a-z0-9-]+\.supabase\.co/functions/v1/analytics-digest$ ]]; then
            echo "Digest URL must point to a Supabase analytics-digest Edge Function."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 45 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-analytics-cron-secret: $ANALYTICS_CRON_SECRET" \
            --data '{}' \
            "$ANALYTICS_DIGEST_URL"

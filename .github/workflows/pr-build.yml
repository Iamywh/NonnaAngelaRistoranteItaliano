name: PR build check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Analytics calculations
        run: node --test tests/analyticsMetrics.test.mjs tests/analyticsPlanning.test.mjs tests/analyticsTargetsValidation.test.mjs tests/analyticsForecast.test.mjs tests/analyticsBreakEven.test.mjs tests/analyticsMonthlyClose.test.mjs tests/analyticsReports.test.mjs tests/analyticsAlerts.test.mjs tests/analyticsDigest.test.mjs tests/analyticsTelegramIsolation.test.mjs tests/analyticsTelegramConnection.test.mjs tests/analyticsTelegramEntry.test.mjs tests/analyticsTelegramExpense.test.mjs tests/analyticsImport.test.mjs tests/analyticsDataQuality.test.mjs tests/publicReservationAuthIsolation.test.mjs
      - name: Verify production build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-not-a-real-key
          VITE_MANAGER_PASSWORD: ci-placeholder-only
